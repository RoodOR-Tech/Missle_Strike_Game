<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Missile Strike</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.7);
      border-bottom: 1px solid #00ff88;
      z-index: 10;
    }
    .hud-item {
      color: #00ff88;
      font-size: 14px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px #00ff88;
    }
    .hud-label { color: #4a9; font-size: 10px; }
    .hud-buttons { display: flex; gap: 8px; }
    .hud-btn {
      width: 34px; height: 34px;
      font-size: 15px;
      background: transparent;
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1;
    }
    .hud-btn:active { background: rgba(0,255,136,0.2); }
    #canvas {
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #00ff88;
    }
    #overlay h1 {
      font-size: 36px;
      letter-spacing: 6px;
      text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88;
      margin-bottom: 8px;
      text-align: center;
    }
    #overlay .subtitle {
      font-size: 13px;
      color: #4af;
      letter-spacing: 3px;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #4af;
    }
    #overlay .info {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      text-align: center;
      max-width: 320px;
      line-height: 1.8;
    }
    #overlay .score-display {
      font-size: 22px;
      color: #ff4444;
      text-shadow: 0 0 12px #ff4444;
      margin: 16px 0 4px;
    }
    #overlay .best-display {
      font-size: 14px;
      color: #ffdd44;
      text-shadow: 0 0 10px #ffdd44;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    #startBtn {
      margin-top: 24px;
      padding: 14px 48px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      letter-spacing: 3px;
      background: transparent;
      color: #00ff88;
      border: 2px solid #00ff88;
      border-radius: 4px;
      cursor: pointer;
      text-shadow: 0 0 8px #00ff88;
      box-shadow: 0 0 16px #00ff88, inset 0 0 16px rgba(0,255,136,0.05);
      transition: all 0.2s;
    }
    #startBtn:hover, #startBtn:active {
      background: rgba(0,255,136,0.15);
      box-shadow: 0 0 30px #00ff88;
    }
    .lives { display: flex; gap: 6px; }
    .life-icon { color: #ff4444; text-shadow: 0 0 6px #ff4444; font-size: 16px; }
    @media (max-width: 420px) {
      #hud { padding: 8px 8px; }
      .hud-item { font-size: 12px; }
      .hud-btn { width: 30px; height: 30px; font-size: 13px; }
    }
  </style>
</head>
<body>
<div id="hud">
  <div class="hud-item">
    <div class="hud-label">SCORE</div>
    <div id="scoreDisplay">0</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">BEST</div>
    <div id="bestDisplay">0</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">WAVE</div>
    <div id="waveDisplay">1</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">LIVES</div>
    <div class="lives" id="livesDisplay"></div>
  </div>
  <div class="hud-buttons">
    <button id="pauseBtn" class="hud-btn" title="Pause (P)">⏸</button>
    <button id="muteBtn" class="hud-btn" title="Toggle sound">🔊</button>
  </div>
</div>
<canvas id="canvas"></canvas>
<div id="overlay">
  <h1>MISSILE STRIKE</h1>
  <div class="subtitle">INTERCEPT &amp; DEFEND</div>
  <div class="info">
    TAP the screen to fire interceptors.<br>
    Protect your cities from incoming missiles.<br>
    Chain kills with one blast for bonus points.<br>
    Each city destroyed = 1 life lost.
  </div>
  <div id="finalScore" class="score-display" style="display:none"></div>
  <div id="bestScore" class="best-display"></div>
  <button id="startBtn">LAUNCH</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreDisplay = document.getElementById('scoreDisplay');
const bestDisplay = document.getElementById('bestDisplay');
const waveDisplay = document.getElementById('waveDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const finalScore = document.getElementById('finalScore');
const bestScore = document.getElementById('bestScore');
const pauseBtn = document.getElementById('pauseBtn');
const muteBtn = document.getElementById('muteBtn');

let W, H, GROUND_Y, LAUNCHER_X, LAUNCHER_Y;
let skyGradient, groundGradient;

let score = 0, wave = 1, lives = 5, aliveCityCount = 5, gameRunning = false, paused = false;
const incomingMissiles = [], playerMissiles = [], explosions = [], particles = [], groundCraters = [], popups = [];
let stars = [], cities = [];
const CITY_COUNT = 5, TAU = Math.PI * 2, MAX_CRATERS = 40;
let spawnTimer = 0, missilesLeftThisWave = 0;
let shakeTimer = 0, shakeMag = 0;
let announceText = '', announceTimer = 0;

const HS_KEY = 'missileStrikeHighScore', MUTE_KEY = 'missileStrikeMuted';
let highScore = 0, muted = false;
try {
  highScore = parseInt(localStorage.getItem(HS_KEY), 10) || 0;
  muted = localStorage.getItem(MUTE_KEY) === '1';
} catch (e) { /* storage unavailable */ }
bestDisplay.textContent = highScore;
muteBtn.textContent = muted ? '🔇' : '🔊';

// ---- Audio (Web Audio API, no assets) ----
let audioCtx = null;
function ensureAudio() {
  if (muted) return;
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, endFreq, dur, type, vol, delay = 0) {
  if (muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur);
}
function noiseBurst(dur, vol, cutoff) {
  if (muted || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(cutoff, t0);
  filt.frequency.exponentialRampToValueAtTime(80, t0 + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
  src.start(t0); src.stop(t0 + dur);
}
const sfxFire      = () => tone(500, 1400, 0.18, 'square', 0.05);
const sfxIntercept = () => { noiseBurst(0.25, 0.18, 1200); tone(280, 60, 0.25, 'triangle', 0.12); };
const sfxGroundHit = () => { noiseBurst(0.35, 0.15, 500); };
const sfxCityHit   = () => { noiseBurst(0.7, 0.3, 700); tone(140, 25, 0.8, 'sawtooth', 0.18); };
const sfxWave      = () => { tone(440, 440, 0.1, 'square', 0.06); tone(554, 554, 0.1, 'square', 0.06, 0.11); tone(659, 659, 0.16, 'square', 0.06, 0.22); };
const sfxGameOver  = () => { tone(330, 330, 0.22, 'sawtooth', 0.1); tone(262, 262, 0.22, 'sawtooth', 0.1, 0.24); tone(196, 98, 0.6, 'sawtooth', 0.1, 0.48); };

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  GROUND_Y   = H - 60;
  LAUNCHER_X = W / 2;
  LAUNCHER_Y = GROUND_Y - 10;
  skyGradient = ctx.createLinearGradient(0, 0, 0, H);
  skyGradient.addColorStop(0,   '#000010');
  skyGradient.addColorStop(0.7, '#050520');
  skyGradient.addColorStop(1,   '#101030');
  groundGradient = ctx.createLinearGradient(0, GROUND_Y - 4, 0, H);
  groundGradient.addColorStop(0, '#1a3a1a');
  groundGradient.addColorStop(1, '#0a1a0a');
  initStars();
  layoutCities();
}

function cityX(i) {
  const margin = W * 0.08, spacing = (W - margin * 2) / (CITY_COUNT - 1);
  return margin + i * spacing;
}

function layoutCities() {
  for (let i = 0; i < cities.length; i++) cities[i].x = cityX(i);
}

function initStars() {
  stars = Array.from({ length: 120 }, () => ({
    x: Math.random() * W, y: Math.random() * H * 0.75,
    r: Math.random() * 1.4 + 0.3, twinkle: Math.random() * TAU,
    speed: 0.01 + Math.random() * 0.03,
  }));
}

function initCities() {
  cities = [];
  for (let i = 0; i < CITY_COUNT; i++)
    cities.push({ x: cityX(i), alive: true, burnTimer: 0 });
  aliveCityCount = CITY_COUNT;
}

function startWave() {
  missilesLeftThisWave = 8 + wave * 2;
  spawnTimer = 0;
  announce(`WAVE ${wave}`);
  if (wave > 1) sfxWave();
}

function announce(text) { announceText = text; announceTimer = 110; }

function addPopup(x, y, text, color) {
  popups.push({ x, y, text, color, life: 1 });
}

function getSpawnInterval() { return Math.max(40, 180 - wave * 15); }

function spawnIncoming() {
  if (aliveCityCount === 0) return;
  let pick = Math.floor(Math.random() * aliveCityCount), targetX = 0;
  for (let i = 0; i < cities.length; i++) {
    if (cities[i].alive) { if (pick === 0) { targetX = cities[i].x; break; } pick--; }
  }
  incomingMissiles.push({
    x: Math.random() * W, y: -10,
    tx: targetX + (Math.random() - 0.5) * 20, ty: GROUND_Y,
    speed: 0.6 + wave * 0.18 + Math.random() * 0.5,
    trail: [], trailHead: 0,
    color: `hsl(${Math.random() * 30 + 340}, 100%, 65%)`, friendly: false,
  });
}

function fireMissile(tx, ty) {
  playerMissiles.push({
    x: LAUNCHER_X, y: LAUNCHER_Y - 16, tx, ty,
    speed: 6 + wave * 0.2, trail: [], trailHead: 0, friendly: true,
  });
  sfxFire();
}

function createExplosion(x, y, radius, color, friendly, cityBlast = false) {
  explosions.push({ x, y, r: 0, maxR: radius, alpha: 1, color, ring: 0, friendly, kills: 0 });
  const count = cityBlast ? 50 : 30, pColor = cityBlast ? '#ff6622' : color, yBias = cityBlast ? 2 : 1;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TAU, spd = Math.random() * 4 + 1;
    particles.push({ x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd - yBias,
      life: 1, decay: 0.02 + Math.random() * 0.03, r: Math.random() * 3 + 1, color: pColor });
  }
}

function addCrater(x, r, alpha) {
  groundCraters.push({ x, r, alpha });
  if (groundCraters.length > MAX_CRATERS) groundCraters.shift();
}

function appendTrail(m, maxLen) {
  if (m.trail.length < maxLen) { m.trail.push({ x: m.x, y: m.y }); }
  else { m.trail[m.trailHead].x = m.x; m.trail[m.trailHead].y = m.y; m.trailHead = (m.trailHead + 1) % maxLen; }
}

function shake(mag, frames) { shakeMag = Math.max(shakeMag, mag); shakeTimer = Math.max(shakeTimer, frames); }

function update() {
  if (missilesLeftThisWave > 0) {
    spawnTimer++;
    if (spawnTimer >= getSpawnInterval()) {
      spawnTimer = 0; spawnIncoming(); missilesLeftThisWave--;
      const extra = Math.floor(wave / 3);
      for (let e = 0; e < extra && missilesLeftThisWave > 0; e++) { spawnIncoming(); missilesLeftThisWave--; }
    }
  }
  for (let i = incomingMissiles.length - 1; i >= 0; i--) {
    const m = incomingMissiles[i], dx = m.tx - m.x, dy = m.ty - m.y, distSq = dx*dx + dy*dy;
    if (distSq < m.speed * m.speed) {
      let hit = null;
      for (let c = 0; c < cities.length; c++)
        if (cities[c].alive && Math.abs(cities[c].x - m.tx) < 30) { hit = cities[c]; break; }
      if (hit) {
        hit.alive = false; hit.burnTimer = 180; aliveCityCount--; lives--;
        updateLivesDisplay();
        createExplosion(m.tx, GROUND_Y, 55, '#ff4400', false, true);
        addCrater(m.tx, 18 + Math.random() * 10, 0.7);
        shake(9, 26);
        sfxCityHit();
      } else {
        createExplosion(m.tx, GROUND_Y, 30, '#ff8800', false);
        addCrater(m.tx, 12 + Math.random() * 6, 0.5);
        shake(3, 10);
        sfxGroundHit();
      }
      incomingMissiles.splice(i, 1);
      if (lives <= 0) { endGame(); return; }
      continue;
    }
    appendTrail(m, 22);
    const dist = Math.sqrt(distSq), inv = m.speed / dist;
    m.x += dx * inv; m.y += dy * inv;
  }
  for (let i = playerMissiles.length - 1; i >= 0; i--) {
    const m = playerMissiles[i], dx = m.tx - m.x, dy = m.ty - m.y, distSq = dx*dx + dy*dy;
    if (distSq < m.speed * m.speed) { createExplosion(m.x, m.y, 45, '#00ffcc', true); playerMissiles.splice(i, 1); continue; }
    appendTrail(m, 14);
    const dist = Math.sqrt(distSq), inv = m.speed / dist;
    m.x += dx * inv; m.y += dy * inv;
  }
  for (let e = 0; e < explosions.length; e++) {
    const exp = explosions[e]; if (!exp.friendly) continue;
    const rSq = (exp.r + 8) * (exp.r + 8);
    for (let i = incomingMissiles.length - 1; i >= 0; i--) {
      const m = incomingMissiles[i], dx = m.x - exp.x, dy = m.y - exp.y;
      if (dx*dx + dy*dy < rSq) {
        createExplosion(m.x, m.y, 28, '#ffdd00', true);
        incomingMissiles.splice(i, 1);
        exp.kills++;
        const points = 10 * wave * exp.kills;
        score += points; scoreDisplay.textContent = score;
        addPopup(m.x, m.y - 12, exp.kills > 1 ? `+${points} x${exp.kills}` : `+${points}`,
          exp.kills > 1 ? '#ffdd44' : '#00ffcc');
        sfxIntercept();
      }
    }
  }
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.r += (e.maxR - e.r) * 0.12; e.ring += 2; e.alpha -= 0.022;
    if (e.alpha <= 0) explosions.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 0.6; p.life -= 0.016;
    if (p.life <= 0) popups.splice(i, 1);
  }
  if (missilesLeftThisWave === 0 && incomingMissiles.length === 0) {
    const bonus = aliveCityCount * 50;
    score += bonus; scoreDisplay.textContent = score;
    if (bonus > 0) addPopup(W / 2, H * 0.35, `CITY BONUS +${bonus}`, '#00ff88');
    wave++; waveDisplay.textContent = wave;
    startWave();
  }
  if (announceTimer > 0) announceTimer--;
  if (shakeTimer > 0) { shakeTimer--; if (shakeTimer === 0) shakeMag = 0; }
  for (let i = 0; i < stars.length; i++) stars[i].twinkle += stars[i].speed;
}

function draw() {
  ctx.fillStyle = skyGradient; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeTimer > 0) {
    const m = shakeMag * (shakeTimer / 26);
    ctx.translate((Math.random() - 0.5) * 2 * m, (Math.random() - 0.5) * 2 * m);
  }
  ctx.fillStyle = '#fff';
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i], a = 0.5 + 0.5 * Math.sin(s.twinkle);
    ctx.globalAlpha = a * 0.9; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * a, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = groundGradient; ctx.fillRect(0, GROUND_Y - 4, W, H - GROUND_Y + 4);
  ctx.strokeStyle = '#00ff88'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 8; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y - 4); ctx.lineTo(W, GROUND_Y - 4); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(10,8,8,0.6)';
  for (let i = 0; i < groundCraters.length; i++) {
    const c = groundCraters[i]; ctx.globalAlpha = c.alpha;
    ctx.beginPath(); ctx.ellipse(c.x, GROUND_Y - 2, c.r, c.r * 0.35, 0, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < cities.length; i++) {
    const city = cities[i];
    if (!city.alive) {
      ctx.fillStyle = '#553311';
      const bx = city.x - 14, by = GROUND_Y - 8;
      ctx.fillRect(bx, by, 28, 8); ctx.fillRect(bx + 4, by - 4, 10, 4);
      if (city.burnTimer > 0) {
        city.burnTimer--;
        ctx.globalAlpha = (city.burnTimer / 180) * 0.8;
        ctx.fillStyle = `rgb(255,${80 + (Math.random() * 80) | 0},0)`;
        ctx.beginPath(); ctx.arc(city.x, by - 2, 6 + Math.random() * 4, 0, TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
      continue;
    }
    const bx = city.x - 16, by = GROUND_Y - 4;
    ctx.fillStyle = '#224422';
    ctx.fillRect(bx, by - 24, 10, 24); ctx.fillRect(bx + 12, by - 18, 10, 18); ctx.fillRect(bx + 22, by - 30, 10, 30);
    ctx.fillStyle = '#aaff88'; ctx.shadowColor = '#00ff44'; ctx.shadowBlur = 4;
    for (let wy = by - 20; wy < by - 2; wy += 6) {
      ctx.fillRect(bx + 2, wy, 3, 3); ctx.fillRect(bx + 14, wy, 3, 3); ctx.fillRect(bx + 24, wy, 3, 3);
    }
    ctx.shadowBlur = 0;
  }
  const lx = LAUNCHER_X, ly = LAUNCHER_Y;
  ctx.fillStyle = '#224455'; ctx.fillRect(lx - 22, ly - 8, 44, 12);
  ctx.fillStyle = '#336677'; ctx.fillRect(lx - 14, ly - 18, 28, 10);
  ctx.strokeStyle = '#00ccff'; ctx.shadowColor = '#00ccff'; ctx.shadowBlur = 8;
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lx, ly - 18); ctx.lineTo(lx, ly - 32); ctx.stroke(); ctx.shadowBlur = 0;
  for (let i = 0; i < incomingMissiles.length; i++) {
    const m = incomingMissiles[i]; drawTrail(m, m.color, 0.6, 2);
    ctx.fillStyle = m.color; ctx.shadowColor = m.color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#00eeff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.8;
  for (let i = 0; i < playerMissiles.length; i++) {
    const m = playerMissiles[i];
    ctx.beginPath();
    ctx.moveTo(m.tx - 5, m.ty - 5); ctx.lineTo(m.tx + 5, m.ty + 5);
    ctx.moveTo(m.tx + 5, m.ty - 5); ctx.lineTo(m.tx - 5, m.ty + 5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.shadowColor = '#00eeff';
  for (let i = 0; i < playerMissiles.length; i++) {
    const m = playerMissiles[i]; drawTrail(m, '#00eeff', 0.7, 1.5);
    ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(m.x, m.y, 3.5, 0, TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;
  for (let i = 0; i < explosions.length; i++) {
    const e = explosions[i]; ctx.globalAlpha = e.alpha;
    const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    grad.addColorStop(0, 'rgba(255,255,220,0.95)'); grad.addColorStop(0.3, e.color); grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.shadowColor = e.color; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
    ctx.globalAlpha = e.alpha * 0.5; ctx.strokeStyle = e.color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.ring, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i]; ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px "Courier New", monospace';
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    ctx.globalAlpha = Math.min(1, p.life * 1.5);
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.restore();
  if (announceTimer > 0) {
    const a = announceTimer > 90 ? (110 - announceTimer) / 20 : Math.min(1, announceTimer / 40);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#00ff88'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20;
    ctx.font = 'bold 30px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText(announceText, W / 2, H * 0.28);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  if (paused && gameRunning) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00ff88'; ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 20;
    ctx.font = 'bold 32px "Courier New", monospace'; ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '13px "Courier New", monospace';
    ctx.fillText('TAP ⏸ OR PRESS P TO RESUME', W / 2, H / 2 + 28);
    ctx.shadowBlur = 0;
  }
  ctx.textAlign = 'left';
}

function drawTrail(m, color, alpha, width) {
  const trail = m.trail, n = trail.length; if (n < 2) return;
  ctx.strokeStyle = color;
  for (let k = 1; k < n; k++) {
    const i0 = (m.trailHead + k - 1) % n, i1 = (m.trailHead + k) % n, t = k / n;
    ctx.globalAlpha = t * alpha; ctx.lineWidth = width * t;
    ctx.beginPath(); ctx.moveTo(trail[i0].x, trail[i0].y); ctx.lineTo(trail[i1].x, trail[i1].y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

let raf;
function loop() {
  if (!gameRunning) return;
  if (!paused) update();
  draw();
  raf = requestAnimationFrame(loop);
}

function startGame() {
  ensureAudio();
  score = 0; wave = 1; lives = 5; paused = false;
  incomingMissiles.length = playerMissiles.length = explosions.length = particles.length = groundCraters.length = popups.length = 0;
  scoreDisplay.textContent = 0; waveDisplay.textContent = 1;
  initStars(); initCities(); updateLivesDisplay(); startWave();
  overlay.style.display = 'none'; finalScore.style.display = 'none';
  gameRunning = true; loop();
}

function endGame() {
  gameRunning = false; cancelAnimationFrame(raf);
  sfxGameOver();
  const isNewBest = score > highScore;
  if (isNewBest) {
    highScore = score;
    bestDisplay.textContent = highScore;
    try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) { /* storage unavailable */ }
  }
  overlay.style.display = 'flex';
  overlay.querySelector('h1').textContent = 'GAME OVER';
  overlay.querySelector('.subtitle').textContent = 'CITIES DESTROYED';
  finalScore.style.display = 'block'; finalScore.textContent = `SCORE: ${score}`;
  bestScore.textContent = isNewBest ? '★ NEW HIGH SCORE ★' : `BEST: ${highScore}`;
  startBtn.textContent = 'PLAY AGAIN';
}

function updateLivesDisplay() {
  livesDisplay.textContent = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < Math.max(0, lives); i++) {
    const s = document.createElement('span'); s.className = 'life-icon'; s.textContent = '🏙'; frag.appendChild(s);
  }
  livesDisplay.appendChild(frag);
}

function togglePause() {
  if (!gameRunning) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '▶' : '⏸';
}

function toggleMute() {
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) { /* storage unavailable */ }
  if (!muted) ensureAudio();
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); if (!gameRunning || paused) return;
  ensureAudio();
  fireMissile(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  if (!gameRunning || paused) return;
  ensureAudio();
  fireMissile(e.clientX, e.clientY);
});
startBtn.addEventListener('click', startGame);
startBtn.addEventListener('touchstart', e => { e.preventDefault(); startGame(); });
pauseBtn.addEventListener('click', togglePause);
muteBtn.addEventListener('click', toggleMute);

window.addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && gameRunning && !paused) togglePause();
});

resize();
window.addEventListener('resize', resize);
initCities();
bestScore.textContent = highScore > 0 ? `BEST: ${highScore}` : '';
(function titleLoop() { if (gameRunning) return; draw(); for (let i = 0; i < stars.length; i++) stars[i].twinkle += stars[i].speed; requestAnimationFrame(titleLoop); })();
</script>
</body>
</html>
